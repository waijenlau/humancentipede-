<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centipede Snake Game</title>
    <style>
        body {
            text-align: center;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: manipulation; /* Prevents zooming on mobile taps */
        }
        canvas {
            border: 2px solid white;
            touch-action: none;
        }
        #restartBtn {
            display: none;
            padding: 10px 20px;
            font-size: 18px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Centipede Snake Game</h1>
    <p>Tap anywhere on the screen to move the snake</p>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <button id="restartBtn">Restart Game</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        let snake = [{ x: 300, y: 300 }];
        let food = { x: 100, y: 100 };
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let gameOver = false;
        let gameStarted = false;
        let birdMoveCounter = 0;

        // Load images
        const snakeHeadImg = new Image();
        snakeHeadImg.src = './snake_head.png';

        const centipedeBodyImg = new Image();
        centipedeBodyImg.src = './centipede_body.png';

        const birdImg = new Image();
        birdImg.src = './bird.png';

        // Bird starts off-screen
        let bird = { x: -gridSize, y: -gridSize };

        function update() {
            if (gameOver) return;
            if (!gameStarted) return;

            direction = nextDirection;
            let head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.y < 0 || head.x >= canvas.width || head.y >= canvas.height || snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                food = { x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                         y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize };
            } else {
                snake.pop();
            }

            // Slow down the bird (move every 3 frames)
            if (birdMoveCounter % 3 === 0) { 
                if (bird.x < head.x) bird.x += gridSize;
                if (bird.x > head.x) bird.x -= gridSize;
                if (bird.y < head.y) bird.y += gridSize;
                if (bird.y > head.y) bird.y -= gridSize;
            }
            birdMoveCounter++;

            // Check if bird catches the snake
            if (bird.x === head.x && bird.y === head.y) {
                endGame();
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw the food
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, gridSize, gridSize);

            // Draw the bird
            ctx.drawImage(birdImg, bird.x, bird.y, gridSize, gridSize);

            // Draw the snake (Centipede)
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.drawImage(snakeHeadImg, segment.x, segment.y, gridSize, gridSize);
                } else {
                    ctx.drawImage(centipedeBodyImg, segment.x, segment.y, gridSize, gridSize);
                }
            });
        }

        function gameLoop() {
            update();
            draw();
        }

        function endGame() {
            gameOver = true;
            document.getElementById("restartBtn").style.display = "block"; // Show restart button
        }

        function restartGame() {
            gameOver = false;
            gameStarted = false;
            snake = [{ x: 300, y: 300 }];
            direction = { x: 0, y: 0 };
            nextDirection = { x: 0, y: 0 };
            food = { x: 100, y: 100 };
            bird = { x: -gridSize, y: -gridSize };
            document.getElementById("restartBtn").style.display = "none"; // Hide restart button
        }

        document.getElementById("restartBtn").addEventListener("click", restartGame);

        // Mobile tap controls
        canvas.addEventListener("click", (event) => {
            if (!gameStarted) gameStarted = true;

            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            if (y < centerY && direction.y === 0) { // Tap upper side -> Move Up
                nextDirection = { x: 0, y: -gridSize };
            }
            if (y > centerY && direction.y === 0) { // Tap lower side -> Move Down
                nextDirection = { x: 0, y: gridSize };
            }
            if (x < centerX && direction.x === 0) { // Tap left side -> Move Left
                nextDirection = { x: -gridSize, y: 0 };
            }
            if (x > centerX && direction.x === 0) { // Tap right side -> Move Right
                nextDirection = { x: gridSize, y: 0 };
            }
        });

        setInterval(gameLoop, 100);
    </script>
</body>
</html>
